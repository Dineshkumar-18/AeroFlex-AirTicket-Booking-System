<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>

<body>

<h2>Reset your AeroFlex password</h2>

<p>Hello,</p>

<p>
    We received a request to reset your AeroFlex password.
</p>

<p>
    Click the button below to create a new password.
</p>

<p>
    <a th:href="${resetLink}">
        Reset Password
    </a>
</p>

<p>
    This link will expire in 30 minutes.
</p>

<p>
    If you did not request a password reset,
    you can safely ignore this email.
</p>

<p>
    Regards,<br>
    AeroFlex Team
</p>

</body>
</html>
