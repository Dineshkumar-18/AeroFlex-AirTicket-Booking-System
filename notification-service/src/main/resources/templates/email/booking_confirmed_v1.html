<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Booking Confirmed</title>
</head>

<body>

<h2>Booking Confirmed 🎉</h2>

<p>Hello,</p>

<p>Your flight booking has been confirmed.</p>

<table>
    <tr>
        <td><strong>Booking ID:</strong></td>
        <td th:text="${bookingId}"></td>
    </tr>

    <tr>
        <td><strong>PNR:</strong></td>
        <td th:text="${pnr}"></td>
    </tr>

    <tr>
        <td><strong>Flight:</strong></td>
        <td th:text="${flightNumber}"></td>
    </tr>

    <tr>
        <td><strong>From:</strong></td>
        <td th:text="${origin}"></td>
    </tr>

    <tr>
        <td><strong>To:</strong></td>
        <td th:text="${destination}"></td>
    </tr>

    <tr>
        <td><strong>Seat:</strong></td>
        <td th:text="${seat}"></td>
    </tr>

    <tr>
        <td><strong>Amount:</strong></td>
        <td th:text="${amountPaid + ' ' + currency}"></td>
    </tr>
</table>

<p>Thank you for booking with AeroFlex.</p>

</body>
</html>
