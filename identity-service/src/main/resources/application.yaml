server:
  port: 8081

spring:
  application:
    name: identity-service

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=AeroFlex_new;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: 900000  # 15 Minutes
  refresh-token-expiration: 604800000  # 7 Days
  cookie-secure: true
  cookie-same-site: None


security:
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY}
  password-reset:
    token-expiration: 30m
    frontend-reset-url: https://localhost:5173/reset-password

management:
  endpoints:
    web:
      exposure:
        include: health,info



    metrics:
      export:
        enabled: true
        url: http://localhost:4318/v1/metrics


  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

    resource-attributes:
      service.name: identity-service

  otlp:
    metrics:
      export:
        enabled: false
        url: http://localhost:4318/v1/metrics

# Kafka configuration



logging:
  level:
    io.micrometer.tracing: DEBUG
    org.springframework.boot.actuate.autoconfigure.tracing: DEBUG

